---
- name: Deploy Java application to Linux VM
  hosts: java_servers
  become: true

  vars_files:
    - vars/values.yml

  tasks:

    # -------------------------------------------------------
    # 1. Install Java runtime
    # -------------------------------------------------------
    - name: Install Java 17
      ansible.builtin.apt:
        name: openjdk-17-jre
        state: present
        update_cache: true


    # -------------------------------------------------------
    # 2. Create application user
    # -------------------------------------------------------
    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin


    # -------------------------------------------------------
    # 3. Create application directory
    # -------------------------------------------------------
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"


    # -------------------------------------------------------
    # 4. Copy JAR to target VM
    # -------------------------------------------------------
    - name: Deploy Java application JAR
      ansible.builtin.copy:
        src: "{{ lookup('env', 'JAR_FILE') }}"
        dest: "{{ app_directory }}/{{ app_jar }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"


    # -------------------------------------------------------
    # 5. Create systemd service
    # -------------------------------------------------------
    - name: Configure Java application systemd service
      ansible.builtin.template:
        src: hello-java.service.j2
        dest: "/etc/systemd/system/{{ app_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Restart Java application


    # -------------------------------------------------------
    # 6. Enable application service
    # -------------------------------------------------------
    - name: Enable Java application service
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        enabled: true
        daemon_reload: true


    # -------------------------------------------------------
    # 7. Start application
    # -------------------------------------------------------
    - name: Start Java application
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: started


    # -------------------------------------------------------
    # 8. Wait for application port
    # -------------------------------------------------------
    - name: Wait for Java application
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        state: started
        timeout: 60


    # -------------------------------------------------------
    # 9. Display deployment status
    # -------------------------------------------------------
    - name: Deployment completed
      ansible.builtin.debug:
        msg:
          - "Application: {{ app_name }}"
          - "Deployment directory: {{ app_directory }}"
          - "Application port: {{ app_port }}"
          - "Deployment completed successfully."


  handlers:

    # -------------------------------------------------------
    # Restart application when JAR/service changes
    # -------------------------------------------------------
    - name: Restart Java application
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: restarted
        daemon_reload: true
