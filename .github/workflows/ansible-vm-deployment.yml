

name: Java CI/CD - Ansible VM Deployment

on:

  push:
    branches:
      - ansible-vm-deployment

  workflow_dispatch:


jobs:

  build-and-deploy:

    name: Build, Analyze and Deploy

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # 1. Checkout source code
      # -------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # 2. Setup Java 17
      # -------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # -------------------------------------------------------
      # 3. Build and test Java application
      # -------------------------------------------------------
      - name: Build and test application
        run: |
          mvn clean package

      # -------------------------------------------------------
      # 4. Start temporary SonarQube
      # -------------------------------------------------------
      - name: Start SonarQube
        run: |
          docker rm -f sonarqube 2>/dev/null || true

          docker run -d \
            --name sonarqube \
            -p 9000:9000 \
            sonarqube:lts-community

          echo "Waiting for SonarQube to start..."

          for i in {1..30}; do
            STATUS=$(curl -s http://localhost:9000/api/system/status | grep -o '"status":"[^"]*"' || true)

            if echo "$STATUS" | grep -q '"status":"UP"'; then
              echo "SonarQube is ready."
              break
            fi

            echo "SonarQube is not ready yet..."
            sleep 10
          done


      # -------------------------------------------------------
      # 5. Create temporary SonarQube token
      # -------------------------------------------------------
      - name: Create SonarQube token
        run: |
          SONAR_TOKEN=$(curl -s -u admin:admin \
            -X POST \
            "http://localhost:9000/api/user_tokens/generate?name=github-actions-${GITHUB_RUN_ID}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")

          echo "SONAR_TOKEN=$SONAR_TOKEN" >> "$GITHUB_ENV"


      # -------------------------------------------------------
      # 6. SonarQube code quality analysis
      # -------------------------------------------------------
      - name: SonarQube analysis
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey=java-python-k8s-cicd


      # -------------------------------------------------------
      # 5. Identify generated JAR
      # -------------------------------------------------------
      - name: Identify application JAR
        run: |

          JAR_FILE=$(find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*original*" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: Application JAR was not found."
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"

          echo "Application JAR:"
          echo "$JAR_FILE"


      # -------------------------------------------------------
      # 6. Install Ansible
      # -------------------------------------------------------
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible


      # -------------------------------------------------------
      # 7. Verify Ansible installation
      # -------------------------------------------------------
      - name: Verify Ansible
        run: |
          ansible --version


      # -------------------------------------------------------
      # 8. Validate Ansible configuration
      # -------------------------------------------------------
      - name: Validate Ansible playbook
        run: |
          ansible-playbook \
            -i ansible/inventory/hosts.yml \
            ansible/deploy.yml \
            --syntax-check


      # -------------------------------------------------------
      # 9. Verify local Ansible connectivity
      # -------------------------------------------------------
      - name: Test Ansible local connectivity
        run: |
          ansible \
            -i ansible/inventory/hosts.yml \
            java_vm \
            -m ping


      # -------------------------------------------------------
      # 10. Deploy JAR using Ansible
      # -------------------------------------------------------
      - name: Deploy application using Ansible
        env:
          JAR_FILE: ${{ github.workspace }}/${{ env.JAR_FILE }}
        run: |
          ansible-playbook \
            -i ansible/inventory/hosts.yml \
            ansible/deploy.yml \
            -e "jar_file=$JAR_FILE"


      # -------------------------------------------------------
      # 11. Validate application deployment
      # -------------------------------------------------------
      - name: Validate deployment
        run: |
          systemctl is-active --quiet hello-java

          echo "Java application is running successfully."

          echo "Application service status:"
          systemctl status hello-java --no-pager


      # -------------------------------------------------------
      # 12. Deployment summary
      # -------------------------------------------------------
      - name: Deployment summary
        run: |
          echo "=========================================="
          echo " Java CI/CD Deployment Completed"
          echo "=========================================="
          echo "Build        : Maven"
          echo "Code Quality : SonarQube"
          echo "Automation   : Ansible"
          echo "Target       : GitHub-hosted Ubuntu Runner"
          echo "Connection   : Local"
          echo "Runtime      : Java 17"
          echo "Deployment   : JAR"
          echo "Service      : systemd"
          echo "=========================================="
