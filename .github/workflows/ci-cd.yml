name: Java CI/CD to Kubernetes

on:

  push:
    branches:
      - divyani1998-patch-1

  workflow_dispatch:

jobs:

  build-scan-deploy:

    # The Ubuntu VM will be configured as this self-hosted runner.
    runs-on: self-hosted

    steps:

      # -------------------------------------------------------
      # 1. Checkout source code
      # -------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # 2. Configure Java
      # -------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # -------------------------------------------------------
      # 3. Build and test Java application
      # -------------------------------------------------------
      - name: Build application
        run: |
          mvn clean package


      # -------------------------------------------------------
      # 4. SonarQube code quality analysis
      # -------------------------------------------------------
      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey=java-python-k8s-cicd


      # -------------------------------------------------------
      # 5. Define Docker image
      # -------------------------------------------------------
      - name: Set image name
        run: |
          echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/hello-java:${GITHUB_SHA}" >> "$GITHUB_ENV"


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify Docker Hub login
        run: |
          docker info | grep -i username || true

      # -------------------------------------------------------
      # 6. Build Docker image
      # -------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME" .


      # -------------------------------------------------------
      # 7. Security scan
      # -------------------------------------------------------
      - name: Scan Docker image
        run: |
          chmod +x scripts/scan-image.sh
          ./scripts/scan-image.sh "$IMAGE_NAME"





      # -------------------------------------------------------
      # 9. Push Docker image
      # -------------------------------------------------------
      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME"


      # -------------------------------------------------------
      # 10. Start Minikube
      # -------------------------------------------------------
      - name: Start Minikube
        run: |
          minikube status || minikube start --driver=docker


      # -------------------------------------------------------
      # 11. Create Kubernetes image pull secret
      # -------------------------------------------------------
      - name: Create Docker Hub image pull secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -


      # -------------------------------------------------------
      # 12. Deploy application using Helm
      # -------------------------------------------------------
      - name: Deploy with Helm
        run: |
          helm upgrade --install hello-java ./helm/hello-java \
            --set image.repository="${{ secrets.DOCKERHUB_USERNAME }}/hello-java" \
            --set image.tag="${GITHUB_SHA}"


      # -------------------------------------------------------
      # 13. Validate Kubernetes deployment
      # -------------------------------------------------------
      - name: Validate deployment
        run: |
          kubectl get pods
          kubectl get services

          kubectl rollout status deployment/hello-java --timeout=120s


      # -------------------------------------------------------
      # 14. Display application information
      # -------------------------------------------------------
      - name: Display application URL
        run: |
          echo "Kubernetes service:"
          kubectl get service hello-java
      
          echo "Application deployed successfully."
          minikube ip
      
          echo "Service port:"
          kubectl get service hello-java -o jsonpath='{.spec.ports[0].nodePort}'
