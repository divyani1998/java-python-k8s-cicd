# Java CI/CD to Kubernetes — DevSecOps Pipeline

#

# Pipeline Flow:

#

# Developer Push

# ↓

# GitHub Actions

# ↓

# Source Checkout — GitHub

# ↓

# Java 17 Setup

# ↓

# Maven Build & Unit Tests

# ↓

# SonarQube — Static Code Quality Analysis

# ↓

# Docker Image Build

# ↓

# Trivy — Container Vulnerability & Secret Scanning

# ↓

# Docker Hub — Container Image Registry

# ↓

# Minikube — Local Kubernetes Cluster

# ↓

# Kubernetes Image Pull Secret

# ↓

# Helm — Kubernetes Deployment

# ↓

# Kubernetes Rollout Validation

# ↓

# Deployment Information

#

# Technologies:

# GitHub Actions | Java 17 | Maven | SonarQube | Docker

# Trivy | Docker Hub | Kubernetes | Minikube | Helm

#

# Security:

# - SonarQube performs source-code quality analysis.

# - Trivy scans the built container image for vulnerabilities and secrets.

# - Docker Hub credentials are stored securely in GitHub Secrets.

# - Kubernetes uses an imagePullSecret to authenticate with Docker Hub.

#

# Deployment:

# - Docker image is tagged using the Git commit SHA.

# - The image is pushed to Docker Hub.

# - Helm deploys the exact image version to Kubernetes.

# - Kubernetes rollout status is validated before the pipeline completes.

#

# Demo Policy:

# Trivy findings are reported for demonstration purposes. The scan

# script is configured to report vulnerabilities without intentionally

# blocking this demo pipeline.

name: Java CI/CD to Kubernetes - DevSecOps

# ---------------------------------------------------------------------------

# PIPELINE TRIGGER

# ---------------------------------------------------------------------------

on:
push:
branches:
- divyani1998-patch-1

# Allows the pipeline to be started manually from GitHub Actions.

workflow_dispatch:

# ===========================================================================

# CI/CD JOB

# ===========================================================================

jobs:

build-scan-deploy:


# Self-hosted Ubuntu runner hosting Docker, Minikube, kubectl and Helm.
runs-on: self-hosted

steps:

  # =====================================================================
  # 1. CHECKOUT SOURCE CODE
  # =====================================================================
  - name: Checkout source code
    uses: actions/checkout@v4


  # =====================================================================
  # 2. CONFIGURE JAVA
  # =====================================================================
  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'


  # =====================================================================
  # 3. BUILD AND TEST
  # =====================================================================
  - name: Build and test Java application
    run: |
      echo "Starting Maven build and test execution..."
      mvn clean package

      echo "Maven build completed successfully."


  # =====================================================================
  # 4. SONARQUBE CODE QUALITY ANALYSIS
  # =====================================================================
  - name: Run SonarQube analysis
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    run: |
      echo "Starting SonarQube static code analysis..."

      mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.projectKey=java-python-k8s-cicd

      echo "SonarQube analysis completed."


  # =====================================================================
  # 5. DEFINE DOCKER IMAGE
  # =====================================================================
  - name: Define Docker image
    run: |
      IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/hello-java:${GITHUB_SHA}"

      echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      echo "Docker image:"
      echo "$IMAGE_NAME"


  # =====================================================================
  # 6. AUTHENTICATE WITH DOCKER HUB
  # =====================================================================
  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}


  # =====================================================================
  # 7. BUILD DOCKER IMAGE
  # =====================================================================
  - name: Build Docker image
    run: |
      echo "Building Docker image..."

      docker build \
        -t "$IMAGE_NAME" .

      echo "Docker image built successfully."

      docker images | grep hello-java || true


  # =====================================================================
  # 8. CONTAINER SECURITY SCANNING
  # =====================================================================
  - name: Scan Docker image with Trivy
    run: |
      echo "Starting Trivy container security scan..."

      chmod +x scripts/scan-image.sh

      ./scripts/scan-image.sh "$IMAGE_NAME"

      echo "Trivy security scanning completed."


  # =====================================================================
  # 9. PUSH IMAGE TO DOCKER HUB
  # =====================================================================
  - name: Push Docker image to Docker Hub
    run: |
      echo "Pushing Docker image to Docker Hub..."

      docker push "$IMAGE_NAME"

      echo "Docker image pushed successfully:"
      echo "$IMAGE_NAME"


  # =====================================================================
  # 10. START / VERIFY MINIKUBE
  # =====================================================================
  - name: Start Minikube Kubernetes cluster
    run: |
      echo "Checking Minikube status..."

      minikube status || minikube start --driver=docker

      echo "Minikube cluster is ready."

      kubectl get nodes


  # =====================================================================
  # 11. CREATE DOCKER HUB IMAGE PULL SECRET
  # =====================================================================
  - name: Create Kubernetes Docker Hub pull secret
    run: |
      echo "Creating/updating Docker Hub image pull secret..."

      kubectl create secret docker-registry dockerhub-secret \
        --docker-server=https://index.docker.io/v1/ \
        --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
        --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
        --dry-run=client \
        -o yaml | kubectl apply -f -

      echo "Docker Hub pull secret is ready."


  # =====================================================================
  # 12. DEPLOY APPLICATION USING HELM
  # =====================================================================
  - name: Deploy application with Helm
    run: |
      echo "Deploying hello-java application using Helm..."

      helm upgrade --install hello-java ./helm/hello-java \
        --set image.repository="${{ secrets.DOCKERHUB_USERNAME }}/hello-java" \
        --set image.tag="${GITHUB_SHA}"

      echo "Helm deployment completed."


  # =====================================================================
  # 13. VALIDATE KUBERNETES DEPLOYMENT
  # =====================================================================
  - name: Validate Kubernetes deployment
    run: |
      echo "Checking Kubernetes pods..."
      kubectl get pods

      echo "Checking Kubernetes services..."
      kubectl get services

      echo "Waiting for application rollout..."

      kubectl rollout status \
        deployment/hello-java \
        --timeout=120s

      echo "Kubernetes deployment successfully rolled out."


  # =====================================================================
  # 14. DISPLAY DEPLOYMENT INFORMATION
  # =====================================================================
  - name: Display application information
    run: |
      echo "======================================================"
      echo "       APPLICATION DEPLOYMENT SUCCESSFUL"
      echo "======================================================"

      echo ""
      echo "Kubernetes Service:"
      kubectl get service hello-java

      echo ""
      echo "Minikube IP:"
      minikube ip

      echo ""
      echo "Service NodePort:"
      kubectl get service hello-java \
        -o jsonpath='{.spec.ports[0].nodePort}'

      echo ""
      echo ""
      echo "Docker Image:"
      echo "$IMAGE_NAME"

      echo ""
      echo "Helm Release:"
      helm list

      echo ""
      echo "======================================================"
      echo "       CI/CD PIPELINE COMPLETED SUCCESSFULLY"
      echo "======================================================"

