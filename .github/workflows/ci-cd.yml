# =============================================================================

# Java CI/CD to Kubernetes - DevSecOps Pipeline

#

# Pipeline Flow:

#

# Developer Push

# |

# v

# GitHub Actions

# |

# v

# Source Checkout

# |

# v

# Java 17 + Maven Build & Tests

# |

# v

# SonarQube - Code Quality Analysis

# |

# v

# Docker Image Build

# |

# v

# Trivy - Container Security Scan

# |

# v

# Docker Hub - Image Registry

# |

# v

# Minikube - Kubernetes Cluster

# |

# v

# Kubernetes Docker Registry Secret

# |

# v

# Helm Deployment

# |

# v

# Kubernetes Rollout Validation

# |

# v

# Deployment Information

#

# Technologies:

# GitHub Actions | Java 17 | Maven | SonarQube | Docker

# Trivy | Docker Hub | Kubernetes | Minikube | Helm

#

# Security:

# - SonarQube performs static code quality analysis.

# - Trivy scans the Docker image for vulnerabilities and secrets.

# - Docker Hub credentials are stored in GitHub Secrets.

# - Kubernetes uses an imagePullSecret for private registry authentication.

#

# Demo:

# Trivy findings are reported but do not intentionally block the demo pipeline.

# =============================================================================

name: Java CI/CD to Kubernetes - DevSecOps

# =============================================================================

# PIPELINE TRIGGERS

# =============================================================================

on:
push:
branches:
- divyani1998-patch-1

workflow_dispatch:

# =============================================================================

# CI/CD JOB

# =============================================================================

jobs:

build-scan-deploy:


# Self-hosted Linux runner with Docker, Minikube, kubectl and Helm installed.
runs-on: self-hosted

steps:

  # -----------------------------------------------------------------------
  # 1. CHECKOUT SOURCE CODE
  # -----------------------------------------------------------------------

  - name: Checkout source code
    uses: actions/checkout@v4


  # -----------------------------------------------------------------------
  # 2. CONFIGURE JAVA 17
  # -----------------------------------------------------------------------

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'


  # -----------------------------------------------------------------------
  # 3. BUILD AND TEST JAVA APPLICATION
  # -----------------------------------------------------------------------

  - name: Build and test application
    run: |
      echo "Starting Maven build and tests..."
      mvn clean package
      echo "Maven build completed successfully."


  # -----------------------------------------------------------------------
  # 4. SONARQUBE CODE QUALITY ANALYSIS
  # -----------------------------------------------------------------------

  - name: Run SonarQube analysis
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    run: |
      echo "Starting SonarQube analysis..."

      mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.projectKey=java-python-k8s-cicd

      echo "SonarQube analysis completed."


  # -----------------------------------------------------------------------
  # 5. DEFINE DOCKER IMAGE
  # -----------------------------------------------------------------------

  - name: Define Docker image
    run: |
      IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/hello-java:${GITHUB_SHA}"

      echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      echo "Docker image:"
      echo "$IMAGE_NAME"


  # -----------------------------------------------------------------------
  # 6. LOGIN TO DOCKER HUB
  # -----------------------------------------------------------------------

  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}


  # -----------------------------------------------------------------------
  # 7. BUILD DOCKER IMAGE
  # -----------------------------------------------------------------------

  - name: Build Docker image
    run: |
      echo "Building Docker image..."

      docker build \
        -t "$IMAGE_NAME" .

      echo "Docker image built successfully."


  # -----------------------------------------------------------------------
  # 8. TRIVY CONTAINER SECURITY SCAN
  # -----------------------------------------------------------------------

  - name: Scan Docker image with Trivy
    run: |
      echo "Starting Trivy security scan..."

      chmod +x scripts/scan-image.sh

      ./scripts/scan-image.sh "$IMAGE_NAME"

      echo "Trivy security scan completed."


  # -----------------------------------------------------------------------
  # 9. PUSH DOCKER IMAGE TO DOCKER HUB
  # -----------------------------------------------------------------------

  - name: Push Docker image to Docker Hub
    run: |
      echo "Pushing Docker image to Docker Hub..."

      docker push "$IMAGE_NAME"

      echo "Docker image pushed successfully."
      echo "$IMAGE_NAME"


  # -----------------------------------------------------------------------
  # 10. START / VERIFY MINIKUBE
  # -----------------------------------------------------------------------

  - name: Start Minikube Kubernetes cluster
    run: |
      echo "Checking Minikube status..."

      minikube status || minikube start --driver=docker

      echo "Minikube cluster is ready."

      kubectl get nodes


  # -----------------------------------------------------------------------
  # 11. CREATE DOCKER HUB IMAGE PULL SECRET
  # -----------------------------------------------------------------------

  - name: Create Kubernetes Docker Hub pull secret
    run: |
      echo "Creating Docker Hub image pull secret..."

      kubectl create secret docker-registry dockerhub-secret \
        --docker-server=https://index.docker.io/v1/ \
        --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
        --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
        --dry-run=client \
        -o yaml | kubectl apply -f -

      echo "Docker Hub pull secret is ready."


  # -----------------------------------------------------------------------
  # 12. DEPLOY APPLICATION USING HELM
  # -----------------------------------------------------------------------

  - name: Deploy application with Helm
    run: |
      echo "Deploying hello-java using Helm..."

      helm upgrade --install hello-java ./helm/hello-java \
        --set image.repository="${{ secrets.DOCKERHUB_USERNAME }}/hello-java" \
        --set image.tag="${GITHUB_SHA}"

      echo "Helm deployment completed successfully."


  # -----------------------------------------------------------------------
  # 13. VALIDATE KUBERNETES DEPLOYMENT
  # -----------------------------------------------------------------------

  - name: Validate Kubernetes deployment
    run: |
      echo "Kubernetes Pods:"
      kubectl get pods

      echo "Kubernetes Services:"
      kubectl get services

      echo "Waiting for deployment rollout..."

      kubectl rollout status \
        deployment/hello-java \
        --timeout=120s

      echo "Kubernetes deployment successfully rolled out."


  # -----------------------------------------------------------------------
  # 14. DISPLAY DEPLOYMENT INFORMATION
  # -----------------------------------------------------------------------

  - name: Display application information
    run: |
      echo "======================================================"
      echo "       APPLICATION DEPLOYMENT SUCCESSFUL"
      echo "======================================================"

      echo ""
      echo "Kubernetes Service:"
      kubectl get service hello-java

      echo ""
      echo "Minikube IP:"
      minikube ip

      echo ""
      echo "Service NodePort:"
      kubectl get service hello-java \
        -o jsonpath='{.spec.ports[0].nodePort}'

      echo ""
      echo ""
      echo "Docker Image:"
      echo "$IMAGE_NAME"

      echo ""
      echo "Helm Release:"
      helm list

      echo ""
      echo "======================================================"
      echo "       CI/CD PIPELINE COMPLETED SUCCESSFULLY"
      echo "======================================================"

